adjust_stock:
  fields:
    config_entry_id: &config_entry
      required: true
      selector:
        config_entry:
          integration: quartermaster
    product: &product
      required: true
      example: "Milk"
      selector:
        text:
    operation:
      default: consume
      selector:
        select:
          translation_key: operation
          options:
            - consume
            - purchase
            - finish
    quantity: &quantity
      example: 1
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    zone: &zone
      example: "Fridge"
      selector:
        text:
    best_before: &best_before
      selector:
        date:

undo_last:
  fields:
    config_entry_id: *config_entry

set_stock:
  fields:
    config_entry_id: *config_entry
    product: *product
    quantity:
      required: true
      example: 2
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    zone: *zone
    best_before: *best_before

add_product:
  fields:
    config_entry_id: *config_entry
    name:
      required: true
      example: "Milk"
      selector:
        text:
    aliases:
      example: "semi-skimmed milk"
      selector:
        text:
          multiple: true
    category:
      example: "Dairy"
      selector:
        text:
    default_zone:
      example: "Fridge"
      selector:
        text:
    unit:
      example: "bottle"
      selector:
        text:
    essential:
      default: false
      selector:
        boolean:
    min_stock: *quantity
    target_stock: *quantity
    visual_hints:
      selector:
        text:
          multiline: true
    barcode:
      selector:
        text:
    shelf_life_days:
      selector:
        number:
          min: 1
          max: 3650
          mode: box

set_essential:
  fields:
    config_entry_id: *config_entry
    product: *product
    essential:
      default: true
      selector:
        boolean:
    min_stock: *quantity
    target_stock: *quantity

export_data:
  fields:
    config_entry_id: *config_entry
    format:
      default: json
      selector:
        select:
          translation_key: export_format
          options:
            - json
            - csv

import_data:
  fields:
    config_entry_id: *config_entry
    filename:
      required: true
      example: "quartermaster-20261108-120000.json"
      selector:
        text:
