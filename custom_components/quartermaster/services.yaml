adjust_stock:
  fields:
    config_entry_id: &config_entry
      selector:
        config_entry:
          integration: quartermaster
    product: &product
      required: true
      example: "Milk"
      selector:
        text:
    operation:
      default: consume
      selector:
        select:
          translation_key: operation
          options:
            - consume
            - purchase
            - finish
    quantity: &quantity
      example: 1
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    zone: &zone
      example: "Fridge"
      selector:
        text:
    best_before: &best_before
      selector:
        date:

add_zone:
  fields:
    config_entry_id: *config_entry
    name:
      required: true
      example: "Fridge"
      selector:
        text:
    aliases:
      example: "frigo"
      selector:
        text:
          multiple: true
    zone_id:
      example: "fridge"
      selector:
        text:

remove_zone:
  fields:
    config_entry_id: *config_entry
    zone:
      required: true
      example: "Fridge"
      selector:
        text:

undo_last:
  fields:
    config_entry_id: *config_entry
    operation_id:
      selector:
        text:

set_stock:
  fields:
    config_entry_id: *config_entry
    product: *product
    quantity:
      required: true
      example: 2
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    zone: *zone
    best_before: *best_before

add_product:
  fields:
    config_entry_id: *config_entry
    name:
      required: true
      example: "Milk"
      selector:
        text:
    aliases:
      example: "semi-skimmed milk"
      selector:
        text:
          multiple: true
    category:
      example: "Dairy"
      selector:
        text:
    default_zone:
      example: "Fridge"
      selector:
        text:
    unit:
      example: "bottle"
      selector:
        text:
    essential:
      default: false
      selector:
        boolean:
    min_stock: *quantity
    target_stock: *quantity
    visual_hints:
      selector:
        text:
          multiline: true
    barcode:
      selector:
        text:
    shelf_life_days:
      selector:
        number:
          min: 1
          max: 3650
          mode: box

set_essential:
  fields:
    config_entry_id: *config_entry
    product: *product
    essential:
      default: true
      selector:
        boolean:
    min_stock: *quantity
    target_stock: *quantity

export_data:
  fields:
    config_entry_id: *config_entry
    format:
      default: json
      selector:
        select:
          translation_key: export_format
          options:
            - json
            - csv

import_data:
  fields:
    config_entry_id: *config_entry
    filename:
      required: true
      example: "quartermaster-20261108-120000.json"
      selector:
        text:

get_suggestions:
  fields:
    config_entry_id: *config_entry

refresh_shopping_list:
  fields:
    config_entry_id: *config_entry

start_shopping:
  fields:
    config_entry_id: *config_entry

add_to_shopping_list:
  fields:
    config_entry_id: *config_entry
    product:
      example: "Milk"
      selector:
        text:
    text:
      example: "Birthday candles"
      selector:
        text:
    quantity: *quantity
    from_suggestion:
      default: false
      selector:
        boolean:

import_from_todo:
  fields:
    config_entry_id: *config_entry
    entity_id:
      required: true
      selector:
        entity:
          domain: todo
    target:
      required: true
      selector:
        select:
          translation_key: import_target
          options:
            - products
            - essentials
            - shopping
    min_stock: *quantity
    apply:
      default: false
      selector:
        boolean:

ask:
  fields:
    config_entry_id: *config_entry
    text:
      required: true
      example: "I finished the milk"
      selector:
        text:
    channel:
      default: service
      selector:
        select:
          translation_key: ask_channel
          options:
            - alexa
            - assist
            - voice
            - telegram
            - dashboard
            - service
    language:
      example: "it"
      selector:
        language:
    session_key:
      example: "kitchen-echo"
      selector:
        text:

analyze_image:
  fields:
    config_entry_id: *config_entry
    zone:
      required: true
      example: "Fridge"
      selector:
        text:
    file:
      example: "/media/fridge.jpg"
      selector:
        text:
    camera_entity_id:
      selector:
        entity:
          domain: camera
    channel:
      default: service
      selector:
        select:
          translation_key: ask_channel
          options:
            - alexa
            - assist
            - voice
            - telegram
            - dashboard
            - service

confirm_pending:
  fields:
    config_entry_id: *config_entry
    proposal_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    decision:
      default: confirm
      selector:
        select:
          translation_key: decision
          options:
            - confirm
            - reject
    items:
      selector:
        object:
    corrections:
      selector:
        object:
